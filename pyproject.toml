[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbook-server"
version = "0.2.0"
description = "Self-hosted server that turns YAML/JSON task catalogs into interactive workbooks for IT apprentices."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "watchfiles>=0.22",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "markdown-it-py>=3.0",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
workbook = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# German content legitimately uses en dashes and typographic quotes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # httpx is the test client named in the stack; Starlette nudges towards httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
